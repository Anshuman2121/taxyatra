name: Build TaxYatra Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install Dependencies
        run: |
          npm install
          cd sidecar && npm install

      - name: Build Sidecar for Windows
        run: cd sidecar && npm run build:pkg:win

      - name: Build Tauri App
        run: cd backend && npx tauri build

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: TaxYatra-Windows-x64
          path: |
            backend/target/release/bundle/nsis/*.exe
            backend/target/release/bundle/msi/*.msi
          retention-days: 30
